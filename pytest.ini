[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (may require database, slower)
    slow: Slow-running tests (> 5 seconds)
    llm: Tests requiring LLM mocking or API calls
    rag: RAG functionality tests
    cli: CLI command tests
    db: Database operation tests
    ml: Machine learning module tests
    reactivation: Tests for reactivation/topic-local/imports system (required CI gate)
    quarantine_chroma: Tests with ChromaDB isolation issues (run separately, non-blocking)
    benchmark: Deterministic benchmark tests (fixed embeddings, no model calls)

# Default command-line options
addopts = -v --tb=short --strict-markers

# Directories to ignore during test collection
norecursedirs =
    adhoc
    drift
    scripts
    _archive
    __pycache__
    .git
    .venv
    evaluation

# Minimum pytest version
minversion = 7.0

